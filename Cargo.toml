[workspace]
members = ["kernel", "userspace/init", "userspace/desktop", "userspace/agent", "userspace/app", "crates/desktop-protocol", "crates/window-protocol", "crates/vm-protocol", "crates/thread-protocol", "crates/sync", "crates/acpi"]
default-members = ["kernel"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
