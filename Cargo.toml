[workspace]
members = ["kernel", "userspace/init", "userspace/desktop", "userspace/app", "crates/desktop-protocol", "crates/window-protocol", "crates/vm-protocol", "crates/thread-protocol", "crates/clock-protocol", "crates/sync", "crates/acpi", "crates/ui-tokens", "crates/ext2-layout"]
exclude = ["tools/mirror-image"]
default-members = ["kernel"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
