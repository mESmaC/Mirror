[package]
name = "mirror-kernel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "mirror-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
limine = "=0.5.0"
linked_list_allocator = { version = "=0.10.6", default-features = false }
mirror-window-protocol = { path = "../crates/window-protocol" }
mirror-ui-tokens = { path = "../crates/ui-tokens" }
mirror-vm-protocol = { path = "../crates/vm-protocol" }
mirror-thread-protocol = { path = "../crates/thread-protocol" }
mirror-acpi = { path = "../crates/acpi" }
mirror-clock-protocol = { path = "../crates/clock-protocol" }

[features]
test-trace = []
boot-smoke = ["test-trace"]
agent-demo = []

[lints]
workspace = true
